# nginx does two jobs:
#   1. Serves the built React app (static files).
#   2. Forwards every /api/ request to the backend container.
# Because the browser only ever talks to nginx, frontend and API share one
# origin, so no CORS configuration is needed.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: hand off to the "backend" service on the shared Docker network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: serve the file if it exists, otherwise index.html,
    # so React Router can handle URLs like /games/12 on a page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
