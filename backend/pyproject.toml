[project]
name = "uttt-backend"
version = "0.1.0"
description = "Ultimate Tic-Tac-Toe API (COSC 410 warmup)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

# This is an application, not a library we publish, so uv should not try to build it.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/F: real errors, I: import order, UP: modern syntax, B: likely bugs, SIM: simpler code
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Our migrations folder is named "alembic", like the library. Tell Ruff which is which.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
